<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Todo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3.5 16a12.5 12.5 0 0 0 25 0z' fill='%230f7a5c'/%3E%3Ccircle cx='16' cy='16' r='12.5' fill='none' stroke='%2313211b' stroke-width='3'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('todo.theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
