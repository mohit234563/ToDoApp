spring:
  application:
    name: ToDo
  mongodb:
    uri: ${MONGO_URI}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 3007

jwt:
  # JWT_SECRET, or the older jwtSecret name. At least 32 characters.
  secret: ${JWT_SECRET:}

app:
  cors:
    # Only needed if the frontend is hosted on a different address than this app.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
